<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <title>LE VAURÉ Order Notification</title>
</head>
<body style="margin:0;padding:0;background:#0a0a0a;font-family:Arial,Helvetica,sans-serif;color:#111111;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#0a0a0a;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:28px 12px 40px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"
               style="width:100%;max-width:620px;background:#ffffff;border-collapse:collapse;">
          <tr>
            <td align="center" style="background:#050505;padding:34px 24px 28px;">
              <img src="https://levaure.store/static/images/logo.png"
                   width="92"
                   alt="LE VAURÉ"
                   style="display:block;width:92px;max-width:92px;height:auto;border:0;outline:none;text-decoration:none;margin:0 auto 16px;">
              <div style="font-size:18px;line-height:22px;font-weight:800;letter-spacing:7px;color:#ffffff;">
                LE VAURÉ
              </div>
              <div style="margin-top:8px;font-size:9px;line-height:14px;font-weight:700;letter-spacing:3px;color:#8f8f8f;">
                MOVE YOUR OWN WAY.
              </div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:42px 34px 18px;">
              <div style="font-size:10px;line-height:14px;font-weight:800;letter-spacing:4px;color:#777777;">
                ORDER PLACED
              </div>
              <div style="margin-top:12px;font-size:34px;line-height:38px;font-weight:900;letter-spacing:-1px;color:#0a0a0a;">
                NEW ORDER RECEIVED
              </div>
              <div style="margin-top:22px;font-size:14px;line-height:23px;color:#555555;max-width:430px;">
                A new LE VAURÉ order has been placed and is ready for review.
              </div>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
