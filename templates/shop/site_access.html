{% load static i18n %}
<!DOCTYPE html>{% get_current_language as LANGUAGE_CODE %}<html lang="{{ LANGUAGE_CODE|default:'en' }}"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LE VAURÉ — {% trans "Private Access" %}</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17241c;color:#f6f1e7;font-family:Arial,sans-serif}.gate{width:min(92vw,520px);text-align:center;padding:60px 42px;border:1px solid rgba(255,255,255,.2)}.brand{font-family:'Times New Roman',serif;font-size:48px;font-weight:400;letter-spacing:.02em;margin:0}.k{font-size:9px;letter-spacing:.28em;margin:18px 0 45px;opacity:.75}.gate input{width:100%;height:54px;background:transparent;border:0;border-bottom:1px solid rgba(255,255,255,.45);color:white;text-align:center;outline:none;font-size:14px}.gate button{width:100%;height:54px;margin-top:22px;background:#f6f1e7;color:#17241c;border:1px solid #f6f1e7;font-size:10px;font-weight:700;letter-spacing:.2em;cursor:pointer}.gate button:hover{background:transparent;color:#f6f1e7}.err{font-size:12px;margin-top:18px}.note{margin-top:45px;font-family:'Times New Roman',serif;font-style:italic;opacity:.7}</style></head><body><main class="gate"><h1 class="brand">LE VAURÉ</h1><p class="k">{% trans "PRIVATE ACCESS · A HIGHER PERSPECTIVE" %}</p><form method="post">{% csrf_token %}<input type="password" name="password" placeholder="{% trans 'Access password' %}" required autofocus><button type="submit">{% trans "ENTER THE STORE" %} →</button>{% if error %}<p class="err">{{ error }}</p>{% endif %}</form><p class="note">{% trans "More than clothes. A higher place." %}</p></main></body></html>
